[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doc2md-cli"
version = "0.1.0"
authors = [
  { name = "Zephyrus Labs", email = "zephyrus.labs@gmail.com" },
]
maintainers = [
  { name = "Shubham Sharma", email = "sharmashubham25962@gmail.com" },
]
description = "Universal Document to LLM-Optimized Markdown Converter (PDF, DOCX, PPTX, TXT)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["markdown", "pdf", "docx", "pptx", "llm", "rag", "cli", "zephyrus-labs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]
dependencies = [
    "pypdf>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
doc2md = "doc2md.cli:main"

[project.urls]
"Homepage" = "https://zephyrus-labs.tech/"
"Repository" = "https://github.com/uchiha-fire/doc2md-cli"
"Bug Tracker" = "https://github.com/uchiha-fire/doc2md-cli/issues"
"Documentation" = "https://github.com/uchiha-fire/doc2md-cli#readme"
"LinkedIn" = "https://www.linkedin.com/in/shubham-sharma-28487819b/"

[tool.setuptools.packages.find]
where = ["."]
include = ["doc2md*"]
